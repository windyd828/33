name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Install Android SDK packages
        run: python3 ci/prepare-sdk.py

      - name: Test key filtering logic
        run: bash ci/test-core.sh

      - name: Build installable debug APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Prepare APK download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HeadsetKeyBlocker-debug.apk

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/HeadsetKeyBlocker-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add download instructions
        env:
          APK_DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
              '## APK 编译完成\n\n'
              f"[下载 HeadsetKeyBlocker-debug.apk]({os.environ['APK_DOWNLOAD_URL']})\n\n"
              '也可在本次运行底部的 Artifacts 中下载。需登录 GitHub。\n\n'
              '安装后按 APP_USAGE.md 启用无障碍服务、保护手机音量键并学习耳机按键。\n'
              '这是测试签名版本；后续构建若因签名不同无法覆盖，请先卸载旧版再安装。\n',
              encoding='utf-8'
          )
          PY
